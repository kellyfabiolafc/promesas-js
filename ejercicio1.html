<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/css/ejercicio1.css" />
</head>


<!-- Debemos construir un buscador de planetas, utilizando SWAPI (https://swapi.dev/planets/3/) Debemos ingresar el ID del planeta y retornar 5 campos (formulario) cualquiera del JSON que obtenemos. Utilice CSS para mejorar la presentación y valide en caso se ingrese un ID inexistente. -->

<body>
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="panel-espacial">
                    <h1 class="titulo h3 mb-2"> BUSCADOR DE PLANETAS </h1>

                    <form id="formBuscador">
                        <div class="mb-3">
                            <label for="idplaneta" class="form-label">
                                ID del planeta
                            </label>

                            <div class="input-group">
                                <input type="number" id="idplaneta" class="form-control" placeholder="Ejemplo: 3"
                                    min="1" required />

                                <button class="btn btn-espacial" type="submit">BUSCAR</button>
                            </div>

                            <div id="mensaje" class="mt-3"></div>
                        </div>

                        <hr class="separador my-4" />

                        <p class="etiqueta mb-3">DATOS DEL PLANETA</p>

                        <div class="row g-3">

                            <div class="col-12">
                                <label for="nombre" class="form-label"> Nombre </label>
                                <input type="text" id="nombre" class="form-control" readonly />
                            </div>

                            <div class="col-md-6">
                                <label for="clima" class="form-label"> Clima </label>
                                <input type="text" id="clima" class="form-control" readonly />
                            </div>

                            <div class="col-md-6">
                                <label for="terreno" class="form-label"> Terreno </label>
                                <input type="text" id="terreno" class="form-control" readonly />
                            </div>

                            <div class="col-md-6">
                                <label for="poblacion" class="form-label"> Población </label>
                                <input type="text" id="poblacion" class="form-control" readonly />
                            </div>

                            <div class="col-md-6">
                                <label for="rotacion" class="form-label">
                                    Periodo de rotación (horas)
                                </label>
                                <input type="text" id="rotacion" class="form-control" readonly />
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script>
        // REFERENCIAS
        const formulario = document.getElementById("formBuscador");
        const mensaje = document.getElementById("mensaje");
        const id = document.getElementById("idplaneta");
        const nombre = document.getElementById("nombre");
        const clima = document.getElementById("clima");
        const terreno = document.getElementById("terreno");
        const poblacion = document.getElementById("poblacion");
        const rotacion = document.getElementById("rotacion");

        formulario.addEventListener("submit", (event) => {
            event.preventDefault();
            obtenerPlaneta(id.value);
        });

        async function obtenerPlaneta(id) {
            const API_URL = `https://swapi.dev/api/planets/${id}/`;

            try {
                mensaje.innerHTML = "";

                const respuesta = await fetch(API_URL);

                if (!respuesta.ok) {
                    if (respuesta.status == 404) {
                        nombre.value = "";
                        clima.value = "";
                        terreno.value = "";
                        poblacion.value = "";
                        rotacion.value = "";

                        mensaje.innerHTML = `
                                <div class="mensaje-error">
                                    ⚠  No existe un planeta con el ID: ${id} ingresado.
                                </div>
        `;

                        return;
                    }

                    throw new Error("Error de comunicación con la API");
                }

                const datos = await respuesta.json();

                nombre.value = datos.name;
                clima.value = datos.climate;
                terreno.value = datos.terrain;
                poblacion.value = datos.population;
                rotacion.value = datos.rotation_period;

                mensaje.innerHTML = `
                                <div class="mensaje-exito">
                                    Planeta encontrado correctamente.
                                </div>
    `;
            } catch (e) {
                console.error(e);

                mensaje.innerHTML = `
                                <div class="mensaje-error">
                                    No se pudo conectar con la API.
                                </div>
    `;
            }
        }
    </script>
</body>

</html>
